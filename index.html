<script id="tailwind-config">

      darkMode: "class",

          colors: {
            "primary": "#8e4e14",

<style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: #fffcf8;
      color: #1d1b1a;
      -webkit-font-smoothing: antialiased;
    }
    
    .pb-safe { padding-bottom: max(env(safe-area-inset-bottom, 0px), 16px); }
    .pt-safe { padding-top: max(env(safe-area-inset-top, 0px), 16px); }

    /* Subtle luxury animations */
    @keyframes avatarBreath {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.02); }
    }

    @keyframes goldHaloPulse {
      0%, 100% { opacity: 0.65; transform: scale(0.97); filter: blur(8px); }
      50% { opacity: 0.95; transform: scale(1.05); filter: blur(12px); }
    }

    @keyframes twinkleSoft {
      0%, 100% { opacity: 0.3; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-16px) translateX(8px); }
    }

    @keyframes shimmerSweep {
      0% { transform: translateX(-150%) skewX(-20deg); }
      30%, 100% { transform: translateX(250%) skewX(-20deg); }
    }

    .animate-avatar-breath { animation: avatarBreath 5s ease-in-out infinite; }
    .animate-halo-pulse { animation: goldHaloPulse 3.5s ease-in-out infinite; }
    .animate-twinkle-1 { animation: twinkleSoft 3s ease-in-out infinite; }
    .animate-twinkle-2 { animation: twinkleSoft 4.2s ease-in-out 1.2s infinite; }
    .animate-twinkle-3 { animation: twinkleSoft 2.8s ease-in-out 0.6s infinite; }
    .animate-float { animation: floatSlow 6s ease-in-out infinite; }

    .shimmer-active-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: inherit;
      pointer-events: none;
      z-index: 10;
    }
    .shimmer-sweep-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 240, 200, 0.4) 45%, rgba(255, 255, 255, 0.7) 50%, rgba(255, 240, 200, 0.4) 55%, transparent 100%);
      animation: shimmerSweep 5.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .luxury-card {
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .luxury-card:hover {
      transform: translateY(-3px);
      border-color: rgba(212, 175, 55, 0.55);
      box-shadow: 0 16px 36px rgba(180, 130, 40, 0.15), 0 4px 12px rgba(0, 0, 0, 0.03);
    }
  </style>

<body class="bg-gradient-to-b from-[#fffcf8] via-[#fbf5ee] to-[#f4ebe1] text-[#1d1b1a] min-h-[100dvh] min-h-[100dvh] w-full flex flex-col justify-between items-center relative overflow-x-hidden">

<div class="absolute top-52 left-8 w-1.5 h-1.5 rounded-full bg-[#b8860b] shadow-[0_0_8px_#f59e0b] animate-twinkle-3"></div>
<div class="absolute top-[40%] right-8 w-2 h-2 rounded-full bg-[#d4af37] shadow-[0_0_10px_#d4af37] animate-twinkle-1"></div>

<!-- 2. Cards Section: Time Podium & Event Details -->
<section class="w-full flex flex-col items-center gap-3.5 pb-1 mt-0.5"><div class="relative w-full bg-gradient-to-b from-white via-[#faf4ea] to-[#f5ebd8] rounded-2xl px-6 py-4 flex flex-col items-center shadow-[0_12px_28px_rgba(164,130,85,0.18),0_2px_8px_rgba(0,0,0,0.04)] border-2 border-[#d4af37]/70 luxury-card overflow-hidden"><div class="shimmer-active-layer"><div class="shimmer-sweep-bar"></div></div><div class="flex items-center gap-2 mb-1 relative z-10"><span class="material-symbols-outlined text-[#8e4e14] text-[20px] font-bold">schedule</span><span class="font-sans-body text-[#6f3800] font-extrabold tracking-[0.18em] uppercase text-[12px] sm:text-[13px]">GIỜ KHAI TIỆC / STARTS AT</span></div><div class="flex items-baseline justify-center gap-2 relative z-10 my-0.5"><span class="font-serif-display text-[44px] sm:text-[48px] leading-none font-bold tracking-tight text-[#1d1b1a]">18:00</span><span class="font-sans-body text-[#8e4e14] font-extrabold tracking-widest text-[16px]">PM</span></div></div><div class="relative w-full bg-white/95 rounded-2xl p-4 sm:p-5 shadow-[0_16px_36px_rgba(164,130,85,0.14),0_4px_14px_rgba(0,0,0,0.03)] backdrop-blur-xl border border-[#e5d2b8] luxury-card overflow-hidden flex flex-col gap-4"><div class="shimmer-active-layer"><div class="shimmer-sweep-bar" style="animation-delay: 2.8s;"></div></div><div class="w-24 h-[2.5px] bg-gradient-to-r from-transparent via-[#d4af37] to-transparent mx-auto shadow-[0_0_8px_#e5a93b]"></div><div class="flex items-center gap-3.5 text-left relative z-10"><div class="w-12 h-12 rounded-xl bg-gradient-to-br from-[#fae8b8] to-[#edd6b3] flex items-center justify-center shrink-0 shadow-sm border border-[#d4af37]/60"><span class="material-symbols-outlined text-[#6f3800] text-[24px] font-bold">calendar_month</span></div><div class="flex flex-col min-w-0"><span class="font-sans-body text-[#78644e] text-[11.5px] sm:text-[12px] tracking-[0.16em] uppercase font-extrabold">NGÀY TỔ CHỨC / DATE</span><span class="font-sans-body text-[#1d1b1a] font-bold text-[20px] sm:text-[22px] tracking-tight mt-0.5 leading-snug">26/09/2026</span><p class="font-sans-body text-[#534439] text-[14px] sm:text-[15px] font-semibold leading-snug mt-0.5">Thứ Bảy, 26 Tháng 9, 2026</p></div></div><div class="w-full h-px bg-gradient-to-r from-transparent via-[#ebdcc7] to-transparent"></div><div class="flex items-start gap-3.5 text-left relative z-10"><div class="w-12 h-12 rounded-xl bg-gradient-to-br from-[#fae8b8] to-[#edd6b3] flex items-center justify-center shrink-0 shadow-sm border border-[#d4af37]/60 mt-0.5"><span class="material-symbols-outlined text-[#6f3800] text-[24px] font-bold">location_on</span></div><div class="flex flex-col min-w-0"><span class="font-sans-body text-[#78644e] text-[11.5px] sm:text-[12px] tracking-[0.16em] uppercase font-extrabold">ĐỊA ĐIỂM / VENUE</span><span class="font-sans-body text-[#1d1b1a] font-bold text-[20px] sm:text-[22px] tracking-tight mt-0.5 leading-snug">Nhà Bà Út</span><p class="font-sans-body text-[#534439] text-[14px] sm:text-[15px] font-semibold leading-snug mt-0.5">7/11B Chánh Hưng, P. Chánh Hưng</p></div></div></div></section>

<div class="w-full flex flex-col items-center justify-center pt-1">
<div class="flex items-center gap-2">
